nodeLinker: hoisted
packages:
  - electron/
  - website/

allowBuilds:
  '@sentry/node-native-stacktrace': true
  es5-ext: false
  esbuild: true
  fs-xattr: true
  macos-alias: true
  vue-demi: false

blockExoticSubdeps: false

# Only install versions published at least 7 days ago (minutes).
minimumReleaseAge: 10080
