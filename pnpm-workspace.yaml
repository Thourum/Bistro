nodeLinker: hoisted
packages:
  - frontend/
  - website/

allowBuilds:
  es5-ext: false
  esbuild: true
  vue-demi: false

blockExoticSubdeps: false

# Only install versions published at least 7 days ago (minutes).
minimumReleaseAge: 10080
# JS half of the pinned Wails v3.0.0 Go module (user-approved 2026-10-29).
minimumReleaseAgeExclude:
  - '@wailsio/runtime@3.0.0'

# GHSA-cg2g-xh64-v4q7: mermaid's transitive dompurify <3.4.17 fails the release audit gate.
overrides:
  'dompurify@<3.4.17': '^3.4.17'
