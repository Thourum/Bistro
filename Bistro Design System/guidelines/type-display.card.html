<!-- @dsCard group="Type" viewport="700x230" name="Display & headings" subtitle="Geist, large, with tight negative tracking." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface-container-lowest); font-family: var(--font-sans); color: var(--color-on-surface); }
  .r { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--color-outline-variant); padding-bottom: 14px; }
  .r:last-child { border: none; }
  .meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-outline); white-space: nowrap; width: 132px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="r"><span class="meta">Display · 60 / -3px</span><span style="font-size:48px;letter-spacing:-0.05em;line-height:1">Settings</span></div>
<div class="r"><span class="meta">Wordmark · 800 caps</span><span style="font-size:34px;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase">Bistro</span></div>
<div class="r"><span class="meta">Heading · 24 / 700</span><span style="font-size:24px;font-weight:700;letter-spacing:-0.015em">Files changed (12)</span></div>
<div class="r"><span class="meta">Body · 14 / 400</span><span style="font-size:14px">Approvals and comments queue locally when you're offline.</span></div>
</body>
</html>
