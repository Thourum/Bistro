# Classification corpus: ~50 realistic PR comments with human-judged ideal
# severities. want_severity is the IDEAL label, not necessarily what the
# engine produces — the accuracy gate (≥70%) measures how well the built-in
# rules + heuristics judge arbitrary text. Deliberate misses are expected.
# Empty want_severity means "should stay unclassified".

# ── CodeRabbit (deterministic emoji format) ──
- author: "coderabbitai[bot]"
  body: "🔒 Potential SQL injection: user input is concatenated directly into the query string."
  want_severity: critical
- author: "coderabbitai[bot]"
  body: "⚠️ Possible nil pointer dereference when the config file is missing."
  want_severity: warning
- author: "coderabbitai[bot]"
  body: "🛠️ Refactor suggestion: extract the retry logic into a helper function."
  want_severity: suggestion
- author: "coderabbitai[bot]"
  body: "💡 Minor: rename `tmp` to something more descriptive."
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "<details><summary>🧹 Nitpick comments (3)</summary>Multiple small style issues found in this file.</details>"
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "🔒 Hardcoded credential detected in the connection string."
  want_severity: critical
- author: "coderabbitai[bot]"
  body: "⚠️ This loop can run unbounded if the channel is never closed."
  want_severity: warning
- author: "coderabbitai[bot]"
  body: "🛠️ Consider using errgroup to bound the concurrency here."
  want_severity: suggestion
- author: "coderabbitai[bot]"
  body: "💡 You could inline this variable."
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "⚠️ Race condition: the counter is written from two goroutines without synchronization."
  want_severity: warning
- author: "coderabbitai[bot]"
  body: "💡 Stylistic preference: an early return would be cleaner here."
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "🛠️ Duplicated code with pkg/util; consider extracting a shared helper."
  want_severity: suggestion
- author: "coderabbitai[bot]"
  body: "The change looks reasonable overall; summary of modifications below."
  want_severity: ""
- author: "coderabbitai[bot]"
  body: "🔒 Auth bypass: the token check is skipped when the header is empty."
  path: "go/internal/auth/middleware.go"
  want_severity: critical
- author: "coderabbitai[bot]"
  body: "<details><summary>🧹 Nitpick comments (1)</summary>Prefer const over let for values that never change.</details>"
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "💡 Nitpick: you could use optional chaining here."
  want_severity: nit
- author: "coderabbitai[bot]"
  body: "⚠️ The mutex is copied by value here; the lock is ineffective."
  want_severity: warning
- author: "coderabbitai[bot]"
  body: "🛠️ Use strings.Builder instead of += concatenation in this loop."
  want_severity: suggestion

