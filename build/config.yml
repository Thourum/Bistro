version: '3'

info:
  companyName: Thourum
  productName: Bistro
  productIdentifier: app.bistro.review
  description: Keyboard-first GitHub PR review client
  copyright: Copyright 2026 Thourum
  comments: Local-first code review
  version: 0.1.0-alpha.1

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, .dev-data]
    file: [.DS_Store, .gitignore, .gitkeep, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
