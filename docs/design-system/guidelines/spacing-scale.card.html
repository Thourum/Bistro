<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px grid. Bistro is dense — rows breathe on 12–16px, not 24–32px." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface-container-lowest); }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 9px; }
  .bar { height: 14px; background: var(--color-primary); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--color-outline); width: 110px; }
</style>
</head>
<body>
  <div class="row"><span class="nm">space-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="nm">space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="nm">space-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="nm">space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="nm">space-6 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="nm">space-8 · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="nm">space-16 · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="nm">space-20 · 80</span><span class="bar" style="width:80px"></span></div>
</body>
</html>
