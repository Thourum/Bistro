<!-- @dsCard group="Type" viewport="700x190" name="Families" subtitle="Geist (UI / display) + JetBrains Mono (code / chrome). The contrast is the brand." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface-container-lowest); }
  .fam { margin-bottom: 22px; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-primary); margin-bottom: 8px; }
  .geist { font-family: var(--font-sans); font-size: 38px; font-weight: 600; letter-spacing: -0.03em; color: var(--color-on-surface); line-height: 1; }
  .mono { font-family: var(--font-mono); font-size: 26px; color: var(--color-on-surface); }
  .glyphs { font-family: var(--font-mono); font-size: 12px; color: var(--color-outline); margin-top: 6px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="fam">
  <div class="tag">Geist — UI &amp; Display</div>
  <div class="geist">Review at the speed of thought</div>
  <div class="glyphs" style="font-family:var(--font-sans)">Aa Bb Cc 0123456789 · weights 300–900</div>
</div>
<div class="fam">
  <div class="tag">JetBrains Mono — Code &amp; Chrome</div>
  <div class="mono">self.verify_integrity_hash()?;</div>
  <div class="glyphs">SYSTEM_STATUS // OPERATIONAL · 0123456789 {}[]()&lt;&gt;</div>
</div>
</body>
</html>
