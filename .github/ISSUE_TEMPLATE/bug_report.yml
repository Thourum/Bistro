name: Bug report
description: Report a reproducible Bistro problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include OAuth tokens, private repository data, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Bistro version or commit
      placeholder: "commit SHA, tag, or packaged version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "macOS 15 arm64, Windows 11 x64, Ubuntu 24.04 x64"
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running Bistro?
      options:
        - From source
        - Packaged build
        - Other
    validations:
      required: true
  - type: dropdown
    id: auth-state
    attributes:
      label: Where does the issue happen?
      options:
        - Before GitHub OAuth
        - During GitHub OAuth
        - After GitHub OAuth
        - Not related to auth
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps are easiest to verify.
      placeholder: "1. Start Bistro...\n2. Open...\n3. Press..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only redacted Electron or bistro-sync output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: For performance issues, include PR file count, changed lines, and whether data was already synced locally.
    validations:
      required: false
